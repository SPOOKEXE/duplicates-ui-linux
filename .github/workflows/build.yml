name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # Built on the oldest supported runner on purpose: the binary links against
    # the runner's glibc, so building on ubuntu-latest would refuse to start on
    # anything older. If this image is ever retired, moving to ubuntu-latest is
    # the fix, at the cost of a newer glibc floor for users.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      # GLFW builds an X11 and a Wayland backend and picks between them at
      # runtime, so both sets of headers are needed here. libwayland-dev pulls in
      # libwayland-bin, which is where the wayland-scanner binary lives; without
      # it GLFW's configure step fails outright.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ ninja-build \
            xorg-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev \
            desktop-file-utils \
            xvfb xdotool x11-apps libgl1-mesa-dri python3-pil

      # FetchContent clones imgui and glfw on every configure, so cache them.
      - name: Cache fetched dependencies
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDUPLICATES_UI_PORTABLE=ON

      - name: Build
        run: cmake --build build

      # The cascade, the keeper rules and the quarantine round trip are all
      # testable without a window, so they are tested without one.
      - name: Unit tests
        run: ./build/unit-tests

      # Compiling proves nothing about whether the window opens, so run the app
      # on a virtual display and check it paints a frame.
      - name: Smoke test
        run: ./tools/smoke-test.sh smoke

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smoke-screenshot
          path: smoke/startup.png
          if-no-files-found: warn

      - name: Stage the direct executable
        run: |
          mkdir -p dist
          strip build/duplicates-ui
          install -m755 build/duplicates-ui dist/duplicates-ui-x86_64
          ldd dist/duplicates-ui-x86_64

      - name: Build the AppImage
        run: ./packaging/make-appimage.sh build/duplicates-ui dist

      - name: Checksums
        working-directory: dist
        run: sha256sum duplicates-ui-x86_64 duplicates-ui-x86_64.AppImage | tee SHA256SUMS

      - uses: actions/upload-artifact@v6
        with:
          name: duplicates-ui-linux-x86_64
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/duplicates-ui-x86_64 \
            dist/duplicates-ui-x86_64.AppImage \
            dist/SHA256SUMS
